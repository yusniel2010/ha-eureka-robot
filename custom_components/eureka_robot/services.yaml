clean_rooms:
  name: Clean rooms
  description: Clean selected IDs from the vacuum's current local rooms attribute using current suction, water and cleaning mode.
  target:
    entity:
      integration: eureka_robot
      domain: vacuum
  fields:
    rooms:
      name: Rooms
      description: One to ten unique room IDs from the rooms attribute.
      required: true
      example: [3, 7]
      selector:
        object:
    repeats:
      name: Repeats
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
